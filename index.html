<html>
<head>
<title>MyPortfolio</title>

<style>
/* Dark mode styles */
body.dark-mode {
  background-color: #121212;
  color: #f5f5f5;
}

header.dark-mode {
  background-color: #1e1e1e;
}

.Nav-Links a.dark-mode {
  color: #f5f5f5;
}

.contact-container.dark-mode,
.resume.dark-mode {
  background: #1e1e1e;
  color: #f5f5f5;
  border-color: #333;
}

/* Toggle switch style */
.switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 25px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 25px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 19px;
  width: 19px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: #333;
}

input:checked + .slider:before {
  transform: translateX(24px);
}

/* Default light mode */
body {
  background-color: #fafafa;
  font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  color: #333;
  margin: 0;
  padding: 0;
}

header {
  width: 100%;
  background-color: #fff;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 1000;
}

header .Nav-Bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

header .Nav-Bar #Logo {
  width: 40px;
  height: 40px;
}

header .Nav-Bar .Nav-Links {
  display: flex;
  gap: 30px;
}

header .Nav-Bar .Nav-Links a {
  font-weight: 500;
  font-size: 15px;
  text-decoration: none;
  color: #333;    
  transition: color 0.3s;
}

.Nav-Links a:hover {
  color: #000;
}

/* Content section */
section {
  max-width: 1000px;
  margin: 60px auto;
  padding: 0 20px;
  color: #333;
}

section #Name {
  font-size: 28px;
  color: #000;
}

section h1 {
  font-size: 36px;
  margin: 10px 0;
  font-weight: 600;
}

section p {
  font-size: 16px;
  line-height: 1.6;
  color: #555;
}

.Socials-Links {
  display: flex;
  gap: 20px;
  margin: 20px 0;
}

.Socials-Links a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
}

.Socials-Links a:hover {
  color: #000;
}

section button {
  padding: 10px 20px;
  background: #333;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
}

section button:hover {
  background: #555;
}

section button a {
  text-decoration: none;
  color: #fff;
}

.AllInfo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 40px;
}

.profile img {
  width: 280px;
  height: auto;
  border-radius: 6px;
}
</style>
</head>

<body>

<header>
  <nav class="Nav-Bar">
    <img src="logo.jpg" id="Logo">
    <div class="Nav-Links">
      <a href="index.html">Home</a>
      <a href="PROJECTS.html">Projects</a>
      <a href="CONTACT.html">Contact</a>
    </div>
    <!-- Switch button -->
    <label class="switch">
      <input type="checkbox" id="Dark">
      <span class="slider"></span>
    </label>
  </nav>
</header>

<section class="AllInfo">
  <div class="Container">
    <div class="Info">
      <h1 id="Name">Hello, I'm Dave!</h1>
      <h1>Web Developer</h1>
      <p>
        I'm a grade 12 student with a strong willingness to learn and grow.<br>
        Eager to develop new skills, gain real-world experience.<br>
        Responsible, adaptable, and committed to doing tasks with effort.
      </p>
      <div class="Socials-Links">
        <a href="https://web.facebook.com/dave.614149">Facebook</a>
        <a href="https://www.instagram.com/davw_zx">Instagram</a>
        <a href="">Tiktok</a>
      </div>
      <button>
        <a href="MOREINFO.html">Know more about me</a>
      </button>
    </div>
  </div>
  <div class="profile">
    <img src="Me.jpg">
  </div>
</section>

<script>
  const toggleBtn = document.getElementById("Dark");
  toggleBtn.addEventListener("change", () => {
    document.body.classList.toggle("dark-mode");
    document.querySelector("header").classList.toggle("dark-mode");

    document.querySelectorAll(".Nav-Links a").forEach(link => {
      link.classList.toggle("dark-mode");
    });

    const contactBox = document.querySelector(".contact-container");
    if (contactBox) contactBox.classList.toggle("dark-mode");

    const resumeBox = document.querySelector(".resume");
    if (resumeBox) resumeBox.classList.toggle("dark-mode");
  });
</script>

</body>
</html>
