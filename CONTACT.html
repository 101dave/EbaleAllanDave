<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CONTACT — Dave</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --muted: #555555;
      --text: #111111;
      --card: #fafafa;
      --accent: #333333;
      --glass: rgba(0, 0, 0, 0.04);
      --radius: 12px;
    }
    body { font-family: "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); line-height: 1.45; }
    body.dark-mode { --bg: #0f1113; --muted: #bfc6cc; --text: #e6eef3; --card: #121416; --accent: #e6eef3; --glass: rgba(255, 255, 255, 0.03); }

    header {
      position: fixed; left: 0; top: 0; height: 100vh; width: 200px;
      background: var(--card); border-right: 1px solid var(--glass);
      display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 28px 12px; z-index: 100;
    }
    .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-container img { width: 32px; height: 32px; object-fit: cover; border-radius: 6px; }
    .logo-link { font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }

    nav.Nav-Links { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: center; }
    nav.Nav-Links a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14px; padding: 8px 12px; border-radius: 8px; width: 100%; text-align: center; }
    nav.Nav-Links a:hover, nav.Nav-Links a.active { color: var(--text); background: var(--glass); font-weight: 700; }

    .topbar { position: fixed; right: 22px; top: 16px; z-index: 101; }
    .switch { position: relative; width: 46px; height: 24px; display: inline-block; }
    .switch input { display: none; }
    .slider { position: absolute; inset: 0; background: #d9d9d9; border-radius: 999px; cursor: pointer; }
    .slider:before { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: 0.22s; }
    input:checked + .slider { background: #2b2b2b; }
    input:checked + .slider:before { transform: translateX(22px); }

    main { margin-left: 220px; padding: 48px 28px; }
    section.card { background: var(--card); border-radius: var(--radius); padding: 28px; max-width: 600px; }
    section.card h1 { font-size: 24px; margin-bottom: 8px; }
    section.card p.lead { color: var(--muted); margin-bottom: 24px; }

    .contact-info { margin-bottom: 24px; display: flex; flex-direction: column; gap: 8px; }
    .contact-info div { font-size: 14px; color: var(--muted); }
    .contact-info a { color: var(--text); font-weight: 600; text-decoration: underline; }

    .contact-form { display: flex; flex-direction: column; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: 600; color: var(--text); }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--glass);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }
    .form-group textarea { resize: vertical; min-height: 100px; }
    
    .submit-btn {
      padding: 10px 18px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
    }

    @media (max-width: 880px) {
      header { position: relative; width: 100%; height: auto; flex-direction: row; justify-content: space-between; padding: 12px 18px; border-right: 0; border-bottom: 1px solid var(--glass); }
      nav.Nav-Links { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      nav.Nav-Links a { width: auto; }
      main { margin-left: 0; padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html#home" class="logo-container">
      <img src="logo.jpg" alt="Dave logo" onerror="this.style.display='none'">
      <span class="logo-link">Dave</span>
    </a>
    <nav class="Nav-Links">
      <a href="index.html#home">Home</a>
      <a href="PROJECTS.html">Projects</a>
      <a href="EXPERIENCE.html">Experience</a>
      <a href="CERTIFICATE.html">Certificates</a>
      <a href="TECHSTACK.html">Tech Stack</a>
      <a href="RECOMMENDATION.html">Recommendations</a>
      <a href="CONTACT.html" class="active">Contact</a>
    </nav>
  </header>

  <div class="topbar">
    <label class="switch"><input type="checkbox" id="Dark"><span class="slider"></span></label>
  </div>

  <main>
    <section class="card">
      <h1>Contact Me</h1>
      <p class="lead">Feel free to reach out for collaborations, questions, or project inquiries.</p>

      <div class="contact-info">
        <div>Email: <a href="mailto:dave@example.com">dave@example.com</a></div>
        <div>Socials: 
          <a href="[https://web.facebook.com/dave.614149](https://web.facebook.com/dave.614149)" target="_blank">Facebook</a> | 
          <a href="[https://www.instagram.com/davw_zx](https://www.instagram.com/davw_zx)" target="_blank">Instagram</a>
        </div>
      </div>

      <form class="contact-form" action="#" method="post" onsubmit="event.preventDefault(); alert('Message sent!');">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" required placeholder="Your name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="your.email@example.com" />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" required placeholder="Write your message here..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </section>
  </main>

  <script>
    const toggle = document.getElementById('Dark');
    if (localStorage.getItem('darkMode') === 'enabled') { document.body.classList.add('dark-mode'); toggle.checked = true; }
    toggle.addEventListener('change', () => {
      if (toggle.checked) { document.body.classList.add('dark-mode'); localStorage.setItem('darkMode', 'enabled'); }
      else { document.body.classList.remove('dark-mode'); localStorage.setItem('darkMode', 'disabled'); }
    });
  </script>
</body>
</html>
